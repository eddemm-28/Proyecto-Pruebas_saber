name: CI

on:
  push:
    branches: [ main, "corte2/**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Unitarias + integración con Testcontainers (el runner de GitHub trae Docker)
      - name: mvn verify
        run: mvn -B verify -Djava.awt.headless=true
      - name: Validar docker-compose
        run: cp .env.example .env && docker compose config -q
