server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/db_users}
    username: ${DB_USER:users_app}
    password: ${DB_PASSWORD:users_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo manda Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-0123456789}
    issuer: saberpro-user-service
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  bcrypt-strength: 10
  bootstrap-admin:
    login: ${ADMIN_LOGIN:admin}
    password: ${ADMIN_PASSWORD:Admin123*}
    email: ${ADMIN_EMAIL:admin@saberpro.local}

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

springdoc:
  swagger-ui.path: /swagger-ui.html

logging:
  level:
    co.edu.unicauca.saberpro: INFO
